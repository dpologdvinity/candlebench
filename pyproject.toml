[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "candlebench"
version = "0.4.1"
description = "Measure which candlestick patterns have a real intraday edge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaitlyn Bassford" }]
keywords = ["backtesting", "candlestick", "trading", "statistics", "bootstrap", "market-microstructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "yfinance>=0.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pylint>=3", "build>=1"]
browser = ["pytest>=8", "playwright>=1.50"]

[project.urls]
Homepage = "https://github.com/dpologdvinity/stock-analyzer"
Repository = "https://github.com/dpologdvinity/stock-analyzer"
Issues = "https://github.com/dpologdvinity/stock-analyzer/issues"

[project.scripts]
candlebench = "candlebench.cli:main"

[tool.setuptools]
packages = ["candlebench", "candlebench.patterns", "candlebench.web", "candlebench.web.static"]

[tool.setuptools.package-data]
"candlebench.web.static" = ["*.css", "*.js", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "browser: Chromium integration tests (install the browser extra and Playwright Chromium)",
    "expected_http_error(*codes): expected resource console errors in browser failure tests",
]

[tool.pylint.main]
# Lint the shipped code, not the virtual environments or build output.
ignore = [".venv", "build"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Lazy imports break the bars/alpaca/ticks/quotes import cycle on purpose, and
# the numerical routines take many named parameters by design.
disable = [
    "import-outside-toplevel",
    "cyclic-import",
    "missing-function-docstring",
    "missing-class-docstring",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-instance-attributes",
]
