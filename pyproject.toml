[build-system]
requires = ["setuptools>=77", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "candlebench"
version = "0.9.0"
description = "Measure which candlestick patterns have a real intraday edge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaitlyn Bassford" }]
keywords = ["backtesting", "candlestick", "trading", "statistics", "bootstrap", "market-microstructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "yfinance>=0.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pylint>=3", "build>=1", "pybind11>=2.13"]
browser = ["pytest>=8", "playwright>=1.50"]

[project.urls]
Homepage = "https://github.com/dpologdvinity/candlebench"
Repository = "https://github.com/dpologdvinity/candlebench"
Issues = "https://github.com/dpologdvinity/candlebench/issues"

[project.scripts]
candlebench = "candlebench.cli:main"

[tool.setuptools]
packages = ["candlebench", "candlebench.patterns", "candlebench.web", "candlebench.web.static"]

[tool.setuptools.package-data]
"candlebench.web.static" = ["*.css", "*.js", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "browser: Chromium integration tests (install the browser extra and Playwright Chromium)",
    "expected_http_error(*codes): expected resource console errors in browser failure tests",
]

[tool.pylint.main]
# Lint the shipped code, not the virtual environments or build output.
ignore = [".venv", "build"]
# Let pylint import the C++ engine to see its functions.
extension-pkg-allow-list = ["candlebench._enginecore"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Lazy imports break the bars/alpaca/ticks/quotes import cycle on purpose, and
# the numerical routines take many named parameters by design.
disable = [
    "import-outside-toplevel",
    "cyclic-import",
    "missing-function-docstring",
    "missing-class-docstring",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-instance-attributes",
]

[tool.cibuildwheel]
# The release wheels: CPython 3.11-3.14 on Linux x86-64, macOS (Intel and Apple
# silicon) and Windows x64. manylinux_2_28 because pyarrow no longer ships wheels
# for older glibc, so tests in the 2014 image tried to compile it from source.
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *_i686"
manylinux-x86_64-image = "manylinux_2_28"
# Every wheel must reproduce the engine record made before the C++ walk existed,
# on the platform it was built for, or the release stops before publishing.
test-sources = ["scripts/engine_golden.py", "tests/data/engine_golden.json"]
test-command = "python scripts/engine_golden.py --check tests/data/engine_golden.json"

[tool.cibuildwheel.environment]
# Fail fast rather than build a dependency from source inside the test env.
PIP_ONLY_BINARY = ":all:"

[tool.cibuildwheel.macos]
# pyarrow's macOS wheels need 12.0, so an older target only promises less.
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0", PIP_ONLY_BINARY = ":all:" }
