name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Core tests
        run: python -m pytest -q -m "not browser"

  browser:
    name: Dashboard tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[browser]'
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: python -m pytest -q tests/browser

  lint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Pylint
        run: pylint --fail-under=9.0 candlebench stock.py

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
      - name: Install into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
      - name: Smoke test outside the checkout
        working-directory: /tmp
        run: |
          /tmp/wheel-env/bin/candlebench --help
          /tmp/wheel-env/bin/python -c "import candlebench.web.server as s; assert (s.STATIC_DIR / 'index.html').is_file()"

  container:
    name: Read-only demo container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t candlebench-demo .
      - name: Serve the demo and check it is read-only
        run: |
          docker run -d --name demo -p 8765:8765 candlebench-demo
          for _ in $(seq 1 90); do
            curl -sf localhost:8765/api/meta > meta.json && break
            sleep 2
          done
          python3 -c "import json; assert json.load(open('meta.json'))['read_only'] is True"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8765/api/run -d '{}')" = 403
          curl -sf localhost:8765/api/results | python3 -c "import json,sys; assert json.load(sys.stdin)['stats']"
          curl -sf -o report.html localhost:8765/api/report
          ! docker logs demo 2>&1 | grep -i traceback
