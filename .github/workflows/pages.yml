name: Pages

# Publishes the landing page, the committed two-year report, and a demo report
# rebuilt from the current code on a synthetic market. The demo needs no market
# data or credentials, so it always reflects the code that was just pushed.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download the published trade files
        # Too large to keep re-committing; they live on a data release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-2026-10-08 --pattern '*.parquet' --dir docs/results
      - name: Run the synthetic demo
        run: candlebench demo --no-serve --cache-dir demo-cache --trials 150
      - name: Assemble the site
        run: |
          mkdir -p site
          cp docs/site/index.html site/index.html
          cp docs/reports/*.html site/
          candlebench report demo-cache/synthetic/last_run.json \
            --trades demo-cache/synthetic/last_run_trades.parquet \
            --out site/demo.html \
            --title "candlebench demo: a synthetic random walk, rebuilt on every push"
          candlebench site demo-cache/synthetic/last_run.json --out site/app/demo \
            --title "candlebench demo: a synthetic random walk"
          candlebench site docs/results/two-year-1m.json --out site/app/real \
            --trades docs/results/two-year-1m-trades.parquet \
            --title "candlebench: two years of 1-minute bars, 117 US stocks and ETFs"
          candlebench site docs/results/two-year-5m-15m-1h.json --out site/app/intervals \
            --trades docs/results/two-year-5m-15m-1h-trades.parquet \
            --title "candlebench: two years of 5-minute, 15-minute and 1-hour bars, 117 US stocks and ETFs"
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
