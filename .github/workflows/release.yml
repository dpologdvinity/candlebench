# Build wheels for every platform and publish to PyPI when a version tag is
# pushed. Publishing uses PyPI trusted publishing: no token is stored anywhere;
# PyPI accepts this workflow's identity for the `pypi` environment.
#
# Run it by hand (Actions -> Release -> Run workflow) to build and test every
# wheel without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist | grep -q "candlebench-${version}" || { echo "no dist files for ${version}"; ls dist; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
