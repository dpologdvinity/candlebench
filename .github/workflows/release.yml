# Build wheels for every platform and publish to PyPI when a version tag is
# pushed. Publishing uses PyPI trusted publishing: no token is stored anywhere;
# PyPI accepts this workflow's identity for the `pypi` environment.
#
# Run it by hand (Actions -> Release -> Run workflow) to build and test every
# wheel without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check every file is this tag's version
        # Exact names, not a substring: tag v0 or v1 must not publish 0.9.1.
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          files=(dist/*)
          [ ${#files[@]} -gt 0 ] || { echo "dist is empty"; exit 1; }
          [ -f "dist/candlebench-${version}.tar.gz" ] || { echo "no sdist for ${version}"; ls dist; exit 1; }
          for f in "${files[@]}"; do
            case "${f#dist/}" in
              "candlebench-${version}-"*.whl|"candlebench-${version}.tar.gz") ;;
              *) echo "${f#dist/} is not version ${version}"; exit 1 ;;
            esac
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
