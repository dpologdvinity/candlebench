# candlebench configuration
#
# Every value below is a default; delete a key to keep the built-in default.
# Unknown keys are rejected rather than ignored, because a silently ignored typo
# in a threshold would change what the run measures with no visible sign.

[run]
# Reserve later market dates before choosing candidates; 0 is exploratory.
holdout_fraction = 0.2
trials = 200
seed = 42

# Chronological slices to divide the trials between, so a pattern's expectancy
# can be read per period. The `stab` column then reports the share of windows
# that were positive, which is a different and harder test than `consist`: a
# pattern that earned its edge in one week and gave it back in the next has no
# stable edge. How much this means depends on `source` below: 28 days of yfinance
# history makes these adjacent weeks of one regime, while years of Alpaca history
# makes them distinct periods. The report states which, measured from the cache
# rather than assumed.
windows = 1

# Where bars come from.
#   "yfinance" needs no credentials and serves roughly 28 days of 1m history
#             and 59 days of the rest. That is one market regime.
#   "alpaca"  needs a free API key in ALPACA_API_KEY and ALPACA_SECRET_KEY and
#             serves consolidated (SIP) bars back to 2016, split-adjusted, which
#             is what makes a multi-regime test possible.
# Each source caches under its own directory, because the two disagree on prices
# by design and a mixed file would carry a fabricated gap where they met.
source = "yfinance"

# How far back to fetch, in days. 0 means the source's own default: the provider
# maximum for yfinance, one year for Alpaca, whose maximum is about a decade and
# too much to pull because a default said nothing. Asking yfinance for more than
# it serves is rejected rather than silently truncated.
lookback_days = 0

# yfinance exposes no interval below 1m, and Alpaca's bar endpoint has no
# sub-minute timeframe either; sub-minute bars must be resampled from raw trades.
intervals = ["1m", "5m", "15m", "30m", "1h"]

cache_dir = ".cache/bars"
throttle_s = 0.3

[universe]
symbols = []          # empty selects the built-in 117-symbol universe
sample_size = 117     # how many of those symbols trials may draw from

[trade]
stop_buffer = 0.001            # pad the stop past the pattern's extreme
reward_multiple = 2.0          # target distance in units of risk
max_hold_bars = 20             # force-close after this many bars
min_risk_pct = 0.0005          # discard signals whose stop is within a tick
risk_per_trade_usd = 100.0     # position size, so commission converts to R
allow_overlapping_trades = false

# A trade never spans two sessions: detectors receive one session's bars at a
# time, so an open position is always closed at that session's final bar.

[costs]
# Where the cost of a round trip comes from. The central finding of this project
# is that costs exceed the patterns' edge, so this is the number the conclusion
# rests on, and it is worth knowing which of the three you are using.
#
#   "quoted"    observed from historical NBBO quotes, per symbol and per
#               time-of-day bucket. The best evidenced. Needs a free Alpaca key
#               and a table from `python -m candlebench quotes`; without one it
#               falls back to the estimator and says so rather than calling an
#               estimate observed.
#   "estimated" inferred from the cached bars' high-low ranges with
#               Corwin-Schultz (2012). Needs no credentials, which is why it is
#               the default. Measured to read low: 1.28 bps per leg against 1.83
#               observed across 50 symbols.
#   "fixed"     a flat slippage_bps. The original guess, kept for comparison.
model = "estimated"

# Used by the fixed model, and as the fallback wherever an estimate is
# unavailable — a session with one usable bar, or one whose estimate clamps to
# zero. An unmeasurable spread is not a free trade.
slippage_bps = 1.0
commission_per_trade = 0.0

# Where the observed half-spread table lives, for model = "quoted".
quote_table = ".cache/bars/quoted_spreads.json"

[thresholds]
doji_body = 0.10               # body/range at or below this is a doji
small_body = 0.30              # body/range at or below this is a small body
long_body = 0.60               # body/range at or above this is a long body
shadow_dominance = 2.0         # long shadow must be this multiple of the body
opposite_shadow_max = 0.25     # opposite shadow as a share of the range
doji_shadow_min = 0.60         # dominant shadow as a share of the range
marubozu_body = 0.90           # body/range at or above this is a marubozu
near_equal = 0.001             # tweezers tolerance, as a share of price
gap_min = 0.0                  # minimum kicker gap, as a share of price
trend_lookback = 10            # bars used to label the prior trend
trend_min_slope = 0.0          # normalised slope needed to call a trend

[stats]
min_sessions = 10             # independent traded market dates per sample
experiment_count = 1          # all configurations tried in a declared sweep
min_trades = 30                # fewer than this reports INSUFFICIENT
min_trades_per_trial = 3       # a trial below this does not count for consistency
bootstrap_samples = 20000
rank_by = "ci_low"             # ci_low | expectancy_r | win_rate | profit_factor | total_return_pct

[patterns]
# Set a name to false, or delete the line, to disable it.
hammer = true
inverted_hammer = true
hanging_man = true
shooting_star = true
dragonfly_doji = true
